[build]
command = "npx next build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Converter: if `public/wasm/soffice.wasm` is not in the deployed repo (GitHub 100MB limit),
# set NEXT_PUBLIC_WASM_ASSET_BASE to an HTTPS URL of a folder containing the same /wasm/ files,
# then clear cache and redeploy.

[context.production.environment]
NEXT_PUBLIC_WASM_ASSET_BASE = "https://wasm.docxform.com/wasm"
